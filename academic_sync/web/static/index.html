<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-token" content="__APP_TOKEN__">
<title>Semester Sync</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='24' rx='5' fill='%23c2410c'/%3E%3Crect x='3' y='5' width='26' height='7' rx='3' fill='%237c2d12'/%3E%3Cpath d='M10 20l4 4 8-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
<script>
  // Apply the saved theme before first paint so dark mode never flashes light.
  try {
    const t = localStorage.getItem("theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div>
        <div class="brand-name">Semester Sync</div>
        <div class="brand-sub" id="semester-label">No semester yet</div>
      </div>
    </div>

    <nav class="nav" aria-label="Main">
      <button class="nav-item" data-view="upcoming"><span class="ico" data-icon="calendar"></span>Upcoming</button>
      <button class="nav-item" data-view="inbox"><span class="ico" data-icon="inbox"></span>Inbox<span class="badge" id="inbox-badge" hidden></span></button>
      <button class="nav-item" data-view="add"><span class="ico" data-icon="plus"></span>Add deadlines</button>
      <button class="nav-item" data-view="connections"><span class="ico" data-icon="plug"></span>Connections<span class="dot-warn" id="conn-warn" hidden></span></button>
    </nav>

    <div class="courses">
      <div class="side-heading">Courses</div>
      <div id="course-list"></div>
    </div>

    <div class="side-foot">
      <button class="ghost small" id="theme-toggle" type="button"><span class="ico" data-icon="moon"></span><span>Theme</span></button>
    </div>
  </aside>

  <main class="main" id="main" tabindex="-1">
    <section class="view" id="view-upcoming"></section>
    <section class="view" id="view-inbox"></section>
    <section class="view" id="view-add"></section>
    <section class="view" id="view-connections"></section>
  </main>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
